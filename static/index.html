<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>审定记录</h2><div><input id="behalf" type="number" placeholder="代送对象 ID（负责人代送时填）"><button onclick="submitReview()">送审异文</button><input id="reviewId" type="number" placeholder="送审 ID"><select id="decision"><option value="approved">通过</option><option value="returned">退回</option></select><input id="opinion" placeholder="审定意见（必填）"><button onclick="decide()">提交审定</button><button onclick="withdraw()">撤回送审</button><button onclick="reviews()">列出本项目审定记录</button></div><pre id="reviewOut"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=typeof x==='string'?x:JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}function submitReview(){const b={variant_id:+variant.value,user_id:+user.value};if(behalf.value)b.on_behalf_of=+behalf.value;post('/api/reviews',b,'#reviewOut')}function decide(){post('/api/reviews/'+reviewId.value+'/decision',{user_id:+user.value,decision:decision.value,opinion:opinion.value},'#reviewOut')}function withdraw(){post('/api/reviews/'+reviewId.value+'/withdraw',{user_id:+user.value},'#reviewOut')}const GROUPS={pending:'待审',returned:'退回',approved:'已通过',withdrawn:'已撤回'};async function reviews(){const d=await(await fetch('/api/works/'+work.value+'/reviews?user_id='+user.value)).json();if(d.ok===false){show('#reviewOut',d);return}let t='';for(const k of['pending','returned','approved','withdrawn']){t+=`【${GROUPS[k]}】(${d[k].length})\n`;for(const r of d[k])t+=`#${r.id} ${r.passage_label} ${r.siglum} 第${r.layer}层 原句:${r.base_text} 拟句:${r.proposed_text} 理由:${r.reason} 送审:${r.submitted_by_name}${r.on_behalf_of_name?'（代'+r.on_behalf_of_name+'送）':''}${r.reviewer_name?' 审定:'+r.reviewer_name+' 意见:'+r.opinion:''}\n`;t+='\n'}show('#reviewOut',t)}state()</script></html>
